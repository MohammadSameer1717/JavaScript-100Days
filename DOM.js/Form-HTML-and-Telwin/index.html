<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div>
        <div>
            <img src="assets/signup-background.svg" alt=""/>
            <img src="assets/teamwork.svg" alt=""/> 
        </div>

        <div>
            <h1>Login</h1>
            <p>Access to 300+ of courses, tutorials and livestreams</p>
            <form action="">
                <div>
                    <div>

                        <div>
                            <input type="=email" placeholder="Email Address"/>
                        </div>
                           <div>
                    <div>

                        <div>
                            <input type="=text" placeholder="Password"/>
                        </div>
                        <button>Sign in</button>
                    </div>
                </div>
            </form>
            <div>
                <p>Dont't have an account?<a>Sign Up</a></p>
                <p>Forget password?<a>Reset Password</a></p>
                <p>Dont't have a password yet?<a>Set Password</a></p>
            </div>
        </div>
    </div>
    <button>Sign Up</button>
</body>
</html>







































 
    
</body>
</html>
